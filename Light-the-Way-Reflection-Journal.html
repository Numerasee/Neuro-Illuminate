<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuro-illuminate · Light the Way · Reflection Journal</title>
<style>
:root{
  --navy:#1b2f6e; --navy-2:#2a4494; --blue:#3f6fd1; --sky:#e8f0fc; --sky-2:#d6e4fa;
  --yellow:#f5c400; --yellow-soft:#fff6cc; --cream:#fffbea; --ink:#1d2433; --muted:#5b6478;
  --line:#d5dbe8; --bg:#f6f8fc; --white:#fff; --ok:#1f8a4c; --danger:#b42318;
  --fs:17px;
}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55}
body.large{--fs:20px}
body.spaced{letter-spacing:.03em;word-spacing:.12em}
body.spaced textarea, body.spaced input{line-height:1.9}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif}
button{font:inherit;cursor:pointer}
a{color:var(--navy-2)}

/* ---------- layout ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.topbar .brand{font-family:Georgia,serif;font-size:1.05rem;letter-spacing:.02em}
.topbar .brand b{color:var(--yellow);font-weight:normal}
.topbar .spacer{flex:1}
.save-state{font-size:.8rem;opacity:.85;display:flex;align-items:center;gap:6px}
.save-state .dot{width:8px;height:8px;border-radius:50%;background:#7bd88f}
.save-state.saving .dot{background:var(--yellow)}
.save-state.error .dot{background:#ff7b7b}
.tb-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:5px 10px;font-size:.8rem}
.tb-btn:hover,.tb-btn[aria-pressed="true"]{background:rgba(255,255,255,.15)}
.tb-btn.primary{background:var(--yellow);color:var(--navy);border-color:var(--yellow);font-weight:600}
.menu-toggle{display:none}

.shell{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 52px)}
nav.side{background:var(--white);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:52px;height:calc(100vh - 52px);overflow:auto}
nav.side .logo{display:block;width:170px;margin:4px auto 16px}
nav.side button.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 10px;color:var(--ink);font-size:.92rem}
nav.side button.nav:hover{background:var(--sky)}
nav.side button.nav[aria-current="page"]{background:var(--navy);color:#fff}
nav.side button.nav[aria-current="page"] .count{background:rgba(255,255,255,.2);color:#fff}
nav.side .tab{width:6px;align-self:stretch;border-radius:3px;background:var(--line)}
nav.side .count{margin-left:auto;font-size:.72rem;background:var(--sky);color:var(--navy);border-radius:999px;padding:1px 8px;white-space:nowrap}
nav.side .group{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:16px 10px 6px}
main{min-width:0;padding:28px clamp(16px,4vw,56px) 80px;max-width:980px;width:100%}

/* ---------- section headers ---------- */
.sec-head{background:linear-gradient(120deg,var(--navy) 0%,var(--navy-2) 70%,var(--blue) 100%);color:#fff;border-radius:16px;padding:22px 26px;position:relative;overflow:hidden;margin-bottom:22px}
.sec-head::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;background:var(--yellow);transform:rotate(45deg);opacity:.9;border-radius:10px}
.sec-head .kicker{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.sec-head h1{margin:4px 0 6px;font-size:1.7rem;font-weight:normal;position:relative;z-index:1;max-width:80%}
.sec-head p{margin:0;max-width:78%;opacity:.95;position:relative;z-index:1}

/* ---------- entries ---------- */
.entry{background:var(--white);border:1px solid var(--line);border-radius:16px;margin:0 0 22px;box-shadow:0 1px 3px rgba(20,30,60,.05)}
.entry>header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--sky);border-radius:16px 16px 0 0}
.entry>header h2{margin:0;font-size:1.15rem;font-weight:normal;color:var(--navy)}
.entry>header .badge{background:var(--navy);color:#fff;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;border-radius:6px;padding:3px 8px}
.entry>header .prog{margin-left:auto;font-size:.78rem;color:var(--muted)}
.entry>header .icon-btn{background:none;border:1px solid transparent;border-radius:8px;padding:4px 8px;color:var(--muted);font-size:.8rem}
.entry>header .icon-btn:hover{border-color:var(--line);background:#fff}
.entry.collapsed .body{display:none}
.entry.collapsed>header{border-bottom:0;border-radius:16px}
.entry .body{padding:8px 22px 22px}

.block{margin-top:22px}
.block-h{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.block-h h3{margin:0;font-size:1.08rem;color:var(--navy);font-weight:bold}
.block-sub{color:var(--muted);font-size:.88rem;margin:0 0 10px}
.ico{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;flex:none;background:var(--yellow-soft);color:var(--navy)}
.ico svg{width:18px;height:18px}
.block.card{background:var(--cream);border:1px solid #f1e3a6;border-radius:14px;padding:16px 18px}
.block.card.blue{background:var(--sky);border-color:var(--sky-2)}

.field{margin:12px 0}
.field label.q, .field .q{display:block;font-weight:600;font-size:.93rem;margin-bottom:6px;color:var(--ink)}
.field .hint{font-weight:normal;color:var(--muted);font-size:.82rem}
input[type=text],input[type=date],textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;transition:border-color .15s, box-shadow .15s}
textarea{min-height:92px;resize:vertical;line-height:1.6}
input:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(63,111,209,.18)}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.iconq{display:flex!important;align-items:flex-start;gap:10px}
.iconq .ico{margin-top:2px}
.wc{font-size:.78rem;color:var(--muted);text-align:right;margin-top:3px}
.wc.over{color:var(--danger);font-weight:600}

.checks{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;background:#fff;font-size:.9rem;cursor:pointer;user-select:none}
.chip input{width:17px;height:17px;accent-color:var(--navy);margin:0}
.chip:has(input:checked){border-color:var(--navy);background:var(--sky)}
.chip:focus-within{box-shadow:0 0 0 3px rgba(63,111,209,.25)}

table.ct{width:100%;border-collapse:separate;border-spacing:0;border:1.5px solid var(--navy);border-radius:12px;overflow:hidden}
table.ct th{background:var(--navy);color:#fff;font-weight:600;font-size:.85rem;text-align:left;padding:8px 10px}
table.ct td{border-top:1px solid var(--line);padding:6px;vertical-align:top}
table.ct td+td,table.ct th+th{border-left:1px solid var(--line)}
table.ct textarea{min-height:70px;border-color:transparent;background:#fbfcff}
table.ct textarea:focus{border-color:var(--blue);background:#fff}
table.ct td.x{width:36px;text-align:center}
.small-btn{background:#fff;border:1.5px dashed var(--navy-2);color:var(--navy-2);border-radius:10px;padding:6px 12px;font-size:.85rem;margin-top:8px}
.small-btn:hover{background:var(--sky)}
.del-row{background:none;border:0;color:var(--muted);font-size:1.1rem;padding:4px}
.del-row:hover{color:var(--danger)}

.numlist{counter-reset:n;margin:0;padding:0;list-style:none}
.numlist li{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.numlist li::before{counter-increment:n;content:counter(n);flex:none;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:.85rem;margin-top:8px}
.numlist textarea{min-height:64px}

.stars{display:flex;gap:4px;align-items:center}
.stars button{background:none;border:0;padding:2px;font-size:1.6rem;line-height:1;color:#c9d2e3}
.stars button.on{color:var(--yellow);text-shadow:0 0 1px #b38f00}
.stars button:focus-visible{outline:2px solid var(--blue);border-radius:6px}
.stars .clear{font-size:.75rem;color:var(--muted);margin-left:6px;border:0;background:none;text-decoration:underline}

.add-entry{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border:2px dashed var(--navy-2);border-radius:16px;background:#fff;color:var(--navy);font-weight:600}
.add-entry:hover{background:var(--sky)}

/* ---------- cover ---------- */
.cover{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;position:relative}
.cover .art{height:170px;background:
  linear-gradient(135deg,transparent 60%,var(--yellow) 60%,var(--yellow) 68%,transparent 68%),
  linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 55%,var(--blue) 100%);position:relative}
.cover .art img{position:absolute;left:28px;bottom:-46px;width:230px;background:#fff;border-radius:16px;padding:12px 16px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.cover .inner{padding:70px 32px 30px}
.cover .tag{font-family:Georgia,serif;font-style:italic;color:#c99c00;font-size:1.5rem;margin:0}
.cover .sub{letter-spacing:.2em;text-transform:uppercase;color:var(--navy);font-size:.85rem;margin:2px 0 22px}
.cover .motto{color:var(--muted);font-style:italic}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.step{background:var(--sky);border-radius:12px;padding:12px 14px;font-size:.88rem}
.step b{display:block;color:var(--navy);margin-bottom:2px}

/* ---------- guidance ---------- */
.prose{background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 26px 20px;margin-bottom:18px}
.prose h3{color:var(--navy);margin:20px 0 6px;font-size:1.12rem}
.prose p{margin:8px 0}
.prose .key{font-family:Georgia,serif;font-size:1.08rem;color:var(--navy);background:var(--yellow-soft);border-left:4px solid var(--yellow);padding:10px 14px;border-radius:0 10px 10px 0}
.prose .think{font-weight:700;color:var(--navy-2);margin-bottom:0}
.prose .think+p{font-style:italic}
.prose ol.loop{columns:2;padding-left:22px}
details.guide{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:14px}
details.guide>summary{cursor:pointer;padding:14px 20px;font-family:Georgia,serif;font-size:1.1rem;color:var(--navy);list-style:none;display:flex;align-items:center;gap:10px}
details.guide>summary::-webkit-details-marker{display:none}
details.guide>summary::after{content:"＋";margin-left:auto;color:var(--muted)}
details.guide[open]>summary::after{content:"－"}
details.guide>.prose{border:0;margin:0;padding-top:0}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.legend div{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.gibbs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.gibbs div{background:var(--sky);border-radius:12px;padding:10px 14px;font-size:.9rem}
.gibbs b{color:var(--navy)}
.gibbs ul{margin:6px 0 0;padding-left:18px}

/* ---------- export ---------- */
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 24px;margin-bottom:18px}
.panel h2{margin:0 0 6px;color:var(--navy);font-weight:normal}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:600;font-size:1rem}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn.yellow{background:var(--yellow);color:var(--navy)}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:#fff;border:1.5px solid #f2c6c2;color:var(--danger)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.summary-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.92rem}
.summary-table td{padding:7px 4px;border-bottom:1px solid var(--line)}
.summary-table td:last-child{text-align:right;color:var(--muted)}
.notice{background:var(--yellow-soft);border:1px solid #f1e3a6;border-radius:12px;padding:10px 14px;font-size:.9rem;margin-top:12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:transform .25s;z-index:50;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  nav.side{position:fixed;left:0;top:52px;width:280px;z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.15)}
  nav.side.open{transform:none}
  .menu-toggle{display:inline-block}
  .row2,.grid2,.legend,.gibbs,.steps{grid-template-columns:1fr}
  .sec-head h1,.sec-head p{max-width:100%}
  .entry>header{flex-wrap:wrap;padding:12px 14px}
  .entry>header h2{flex:1 1 60%}
  .entry>header .prog{margin-left:0;width:100%;order:5}
  .entry .body{padding:6px 14px 18px}
  .menu-toggle{white-space:nowrap}
  .tb-btn.primary{white-space:nowrap}
  .sec-head::after{opacity:.25}
  .topbar .brand{display:none}
  .save-state .txt{display:none}
  .topbar{gap:8px;padding:10px 12px}
  .tb-btn{padding:5px 8px}
}
</style>
</head>
<body>
<div class="topbar">
  <button class="tb-btn menu-toggle" id="menuBtn" aria-label="Open menu">☰ Menu</button>
  <div class="brand"><b>Neuro-illuminate</b> · Light the Way</div>
  <div class="spacer"></div>
  <div class="save-state" id="saveState" aria-live="polite"><span class="dot"></span><span class="txt">All changes saved</span></div>
  <button class="tb-btn" id="sizeBtn" aria-pressed="false" title="Larger text">A+</button>
  <button class="tb-btn" id="spaceBtn" aria-pressed="false" title="Wider letter and line spacing">Spacing</button>
  <button class="tb-btn primary" data-go="export">Submit / Download</button>
</div>
<div class="shell">
  <nav class="side" id="side" aria-label="Journal sections"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="restoreFile" accept=".json,application/json" class="sr" aria-hidden="true" tabindex="-1">

<script id="docx-lib">
/* ===================== Minimal, dependency-free .docx writer ===================== */
var DocxLib = (function(){
  var CRC_T = (function(){var t=[],c;for(var n=0;n<256;n++){c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
  function crc32(u8){var c=0xFFFFFFFF;for(var i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
  function zip(files){ // files: [{name, data:Uint8Array}] — stored (no compression)
    var enc=new TextEncoder(), parts=[], central=[], offset=0;
    var d=new Date(), dosT=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1), dosD=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
    files.forEach(function(f){
      var nm=enc.encode(f.name), data=f.data, crc=crc32(data);
      var h=new DataView(new ArrayBuffer(30));
      h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);
      h.setUint16(10,dosT,true);h.setUint16(12,dosD,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);
      h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
      parts.push(new Uint8Array(h.buffer),nm,data);
      var c=new DataView(new ArrayBuffer(46));
      c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);
      c.setUint16(12,dosT,true);c.setUint16(14,dosD,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);
      c.setUint16(28,nm.length,true);c.setUint16(30,0,true);c.setUint16(32,0,true);c.setUint16(34,0,true);c.setUint16(36,0,true);c.setUint32(38,0,true);c.setUint32(42,offset,true);
      central.push(new Uint8Array(c.buffer),nm);
      offset+=30+nm.length+data.length;
    });
    var cdSize=central.reduce(function(a,b){return a+b.length;},0);
    var e=new DataView(new ArrayBuffer(22));
    e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdSize,true);e.setUint32(16,offset,true);
    var all=parts.concat(central,[new Uint8Array(e.buffer)]), total=all.reduce(function(a,b){return a+b.length;},0), out=new Uint8Array(total), p=0;
    all.forEach(function(a){out.set(a,p);p+=a.length;});
    return out;
  }
  function esc(s){return String(s==null?'':s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function run(text,o){
    o=o||{};var rp='';
    if(o.b)rp+='<w:b/>';if(o.i)rp+='<w:i/>';if(o.color)rp+='<w:color w:val="'+o.color+'"/>';if(o.sz)rp+='<w:sz w:val="'+o.sz+'"/><w:szCs w:val="'+o.sz+'"/>';
    if(o.font)rp+='<w:rFonts w:ascii="'+o.font+'" w:hAnsi="'+o.font+'" w:cs="'+o.font+'"/>';
    var lines=String(text==null?'':text).replace(/\r\n?/g,'\n').split('\n'),x='';
    lines.forEach(function(l,i){if(i)x+='<w:br/>';x+='<w:t xml:space="preserve">'+esc(l)+'</w:t>';});
    return '<w:r>'+(rp?'<w:rPr>'+rp+'</w:rPr>':'')+x+'</w:r>';
  }
  function p(content,o){
    o=o||{};var pp='';
    if(o.style)pp+='<w:pStyle w:val="'+o.style+'"/>';
    if(o.keepNext)pp+='<w:keepNext/>';
    if(o.pageBreakBefore)pp+='<w:pageBreakBefore/>';

    return '<w:p>'+(pp?'<w:pPr>'+pp+'</w:pPr>':'')+body+'</w:p>';
  }
  function table(headers,rows,widths){
    var tw=widths.reduce(function(a,b){return a+b;},0);
    var x='<w:tbl><w:tblPr><w:tblW w:w="'+tw+'" w:type="dxa"/><w:tblBorders>'+
      ['top','left','bottom','right','insideH','insideV'].map(function(s){return '<w:'+s+' w:val="single" w:sz="6" w:space="0" w:color="1B2F6E"/>';}).join('')+
      '</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:top w:w="80" w:type="dxa"/><w:left w:w="110" w:type="dxa"/><w:bottom w:w="80" w:type="dxa"/><w:right w:w="110" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>'+
      widths.map(function(w){return '<w:gridCol w:w="'+w+'"/>';}).join('')+'</w:tblGrid>';
    x+='<w:tr><w:trPr><w:tblHeader/></w:trPr>'+headers.map(function(h,i){return '<w:tc><w:tcPr><w:tcW w:w="'+widths[i]+'" w:type="dxa"/><w:shd w:val="clear" w:color="auto" w:fill="1B2F6E"/></w:tcPr>'+p(h,{style:'TableText',run:{b:true,color:'FFFFFF'}})+'</w:tc>';}).join('')+'</w:tr>';
    rows.forEach(function(r){x+='<w:tr><w:trPr><w:cantSplit/></w:trPr>'+r.map(function(c,i){return '<w:tc><w:tcPr><w:tcW w:w="'+widths[i]+'" w:type="dxa"/></w:tcPr>'+p(c,{style:'TableText'})+'</w:tc>';}).join('')+'</w:tr>';});
    return x+'</w:tbl>';
  }
  function image(rid,cxEmu,cyEmu,id){
    return '<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="'+cxEmu+'" cy="'+cyEmu+'"/><wp:docPr id="'+id+'" name="Logo '+id+'"/>'+

function allFields(sec){var f=[];sec.blocks.forEach(function(b){b.fields.forEach(function(x){f.push(x);});});return f;}
function isFilled(f,v){
  if(v==null)return false;
  if(f.t==='checks')return Array.isArray(v)&&v.length>0;
  if(f.t==='stars')return v>0;
  if(f.t==='table')return Array.isArray(v)&&v.some(function(r){return r.some(function(c){return String(c||'').trim();});});
  if(f.t==='list')return Array.isArray(v)&&v.some(function(c){return String(c||'').trim();});
  return String(v).trim().length>0;
}
function entryProgress(sec,e){
  var fs=allFields(sec).filter(function(f){return !f.showIf;}),n=0;
  fs.forEach(function(f){if(isFilled(f,e[f.k]))n++;});
  return {done:n,total:fs.length};
}

    if(f.t==='text'||f.t==='date'){return;} // handled as meta
    if(f.t==='checks'){var arr=Array.isArray(v)?v:[];meta(f.l.replace(/:$/,''),f.opts.map(function(o){return (arr.indexOf(o)>-1?'☒ ':'☐ ')+o;}).join('    '));return;}
    if(f.t==='stars'){x.push(P([D.run(f.l+': ',{b:true}),D.run(v?('★★★★★'.slice(0,v)+'☆☆☆☆☆'.slice(0,5-v)):'☆☆☆☆☆',{color:'C99C00',sz:26}),D.run(v?'  ('+v+' / 5)':'  (not rated)',{color:'5B6478'})],{style:'Meta',spacing:'w:before="120" w:after="60"'}));return;}
    if(f.t==='table'){
      var rows=(Array.isArray(v)?v:[]).filter(function(r){return r.some(function(c){return String(c||'').trim();});});
      if(!rows.length)rows=[[NONE,'','']];
      x.push(D.table(f.cols,rows,[2700,3600,3338]));x.push(P('',{spacing:'w:after="60"'}));return;
    }
    if(f.t==='list'){var arr2=Array.isArray(v)?v:[];for(var i=0;i<f.n;i++){x.push(P([D.run((i+1)+'. ',{b:true,color:'1B2F6E'})],{style:'Question',spacing:'w:before="80" w:after="20"'}));ans(arr2[i]);}return;}
    if(f.t==='words'){ans(v);var wc=String(v||'').trim()?String(v).trim().split(/\s+/).length:0;x.push(P('Word count: '+wc+' / '+f.limit,{style:'Intro',run:{i:true,color:'5B6478',sz:18}}));return;}
    var label=f.l+(f.hint?' — '+f.hint.replace(/…$/,''):'');
    if(label)q(label);
    ans(v);
  }
  // ---- cover ----
  if(logoBytes){x.push(P([D.image('rIdLogo',2560320,Math.round(2560320*184/469),1)],{spacing:'w:before="600" w:after="200"'}));}
  x.push(P('Light the Way',{style:'Title'}));
  x.push(P('A Reflection Journal',{style:'Subtitle'}));
  x.push(P('',{spacing:'w:after="400"'}));
  meta('Name',name);meta('Module',mod);
  meta('Date submitted',fmtDate(new Date().toISOString().slice(0,10)));
  x.push(P('',{spacing:'w:after="200"'}));
  x.push(P('Contents',{style:'Heading3'}));
  var included=SECTIONS.filter(function(s){return s.id!=='sunshine'||state.includeSunshine;});
  included.forEach(function(s){
    var n=s.multi?state[s.id].length:1;
    x.push(P([D.run(s.title,{b:true}),D.run(s.multi?'  —  '+n+' '+(n===1?'entry':'entries'):'',{color:'5B6478'})],{style:'Meta'}));
  });
  x.push(P('This journal is a space for thinking, not just recording.',{style:'Intro',spacing:'w:before="600"'}));
  // ---- sections ----
  included.forEach(function(sec){
    var entries=sec.multi?state[sec.id]:[state[sec.id]];
    x.push(P(sec.title,{style:'Heading1',pageBreakBefore:true}));
    if(sec.intro)x.push(P(sec.intro,{style:'Intro'}));
    entries.forEach(function(e,idx){
      var head=sec.multi?(sec.entryName+' '+(idx+1)):sec.entryName;
      var t=sec.titleKey&&String(e[sec.titleKey]||'').trim();
      if(t&&sec.titleKey!=='citation'){t=t.split('\n')[0];head+=': '+(t.length>80?t.slice(0,77)+'…':t);}
      x.push(P(head,{style:'Heading2',pageBreakBefore:sec.multi&&idx>0}));
      // meta line fields (text/date)
      allFields(sec).forEach(function(f){
        if(f.t==='text'||f.t==='date'){
          if(f.showIf){var dep=e[f.showIf[0]]||[];if(dep.indexOf(f.showIf[1])<0)return;}
          meta(f.l,f.t==='date'?fmtDate(e[f.k]):e[f.k]);
        }
      });
      sec.blocks.forEach(function(b){
        if(b.h)x.push(P(b.h,{style:'Heading3'}));
        if(b.sub)x.push(P(b.sub,{style:'Intro'}));
        b.fields.forEach(function(f){
          field(f,e[f.k]);
        });
      });
    });
  });
  var footer=[name||'Reflection Journal',mod].filter(Boolean).join(' · ');
  return D.build(x.join(''),{footerText:footer,title:'Light the Way — Reflection Journal'+(name?' — '+name:''),author:name||'Neuro-illuminate learner',logo:logoBytes});
}
</script>

var STORE_KEY='neuroilluminate-light-the-way-journal-v1';
var main=document.getElementById('main'), side=document.getElementById('side');
var state=load()||freshState();
var view='home';

function newEntry(sec){
  var e={id:Math.random().toString(36).slice(2,10)};
  allFields(sec).forEach(function(f){
    if(f.t==='table')e[f.k]=Array.from({length:f.rows},function(){return f.cols.map(function(){return '';});});
    else if(f.t==='list')e[f.k]=Array.from({length:f.n},function(){return '';});
    else if(f.t==='checks')e[f.k]=[];
    else if(f.t==='stars')e[f.k]=0;
    else e[f.k]='';
  });
  return e;
}
function freshState(){
  var s={version:1,cover:{name:'',module:''},includeSunshine:true,updated:null};
  SECTIONS.forEach(function(sec){s[sec.id]=sec.multi?[newEntry(sec)]:newEntry(sec);});
  return s;
}
function normalise(s){ // make sure a loaded/restored state has every section
  var f=freshState();
  s.cover=s.cover||f.cover;
  if(typeof s.includeSunshine!=='boolean')s.includeSunshine=true;
  SECTIONS.forEach(function(sec){
    if(sec.multi){if(!Array.isArray(s[sec.id])||!s[sec.id].length)s[sec.id]=f[sec.id];}
    else if(!s[sec.id]||typeof s[sec.id]!=='object')s[sec.id]=f[sec.id];
  });
  return s;
}
function load(){try{var r=localStorage.getItem(STORE_KEY);return r?normalise(JSON.parse(r)):null;}catch(e){return null;}}
var saveTimer=null, ss=document.getElementById('saveState');
function setSave(cls,txt){ss.className='save-state '+cls;ss.querySelector('.txt').textContent=txt;}
function save(){
  setSave('saving','Saving…');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){writeNow();renderNav();},400);
}
function writeNow(){
  clearTimeout(saveTimer);saveTimer=null;
  state.updated=new Date().toISOString();
  try{localStorage.setItem(STORE_KEY,JSON.stringify(state));setSave('','All changes saved');}
  catch(e){setSave('error','Not saved — use “Save a backup”');}
}
window.addEventListener('pagehide',function(){if(saveTimer)writeNow();});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'&&saveTimer)writeNow();});
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show');},3200);}
function h(tag,attrs,children){
  var el=document.createElement(tag);
  if(attrs)for(var k in attrs){
    if(k==='class')el.className=attrs[k];
    else if(k==='html')el.innerHTML=attrs[k];
    else if(k==='text')el.textContent=attrs[k];
    else if(k.slice(0,2)==='on')el.addEventListener(k.slice(2),attrs[k]);
    else if(attrs[k]!==null&&attrs[k]!==undefined&&attrs[k]!==false)el.setAttribute(k,attrs[k]);
  }
  (children||[]).forEach(function(c){if(c==null)return;el.appendChild(typeof c==='string'?document.createTextNode(c):c);});
  return el;
}
function autoGrow(t){t.style.height='auto';t.style.height=Math.max(t.scrollHeight+2,parseInt(getComputedStyle(t).minHeight)||0)+'px';}
var uid=0;function nid(){return 'f'+(++uid);}

/* ---------- nav ---------- */
function renderNav(){
  side.innerHTML='';
  side.appendChild(h('img',{class:'logo',src:'data:image/png;base64,'+LOGO_B64,alt:'Neuro-illuminate'}));
  function item(id,label,count,color,icon){
    var b=h('button',{class:'nav','aria-current':view===id?'page':null,onclick:function(){go(id);}},[
      color?h('span',{class:'tab',style:'background:'+color}):h('span',{class:'ico',style:'width:22px;height:22px;background:none',html:ICONS[icon]||''}),
      h('span',{text:label}), count!=null?h('span',{class:'count',text:count}):null]);
    side.appendChild(b);
  }
  item('home','Cover & Contents',null,null,'home');
  item('guide','Guidance & Principles',null,null,'book');
  var last='';
  SECTIONS.forEach(function(sec){
    if(sec.group!==last){side.appendChild(h('div',{class:'group',text:sec.group}));last=sec.group;}
    var c;
    if(sec.multi){c=state[sec.id].length+(state[sec.id].length===1?' entry':' entries');}
    else{var p=entryProgress(sec,state[sec.id]);c=p.done+'/'+p.total;}
    item(sec.id,sec.nav,c,sec.tabColor);
  });
  side.appendChild(h('div',{class:'group',text:'Finish'}));
  item('export','Submit / Download',null,null,'send');
}
function go(id){view=id;render();side.classList.remove('open');window.scrollTo(0,0);main.focus({preventScroll:true});}

/* ---------- fields ---------- */
function renderField(f,e,onChange){
  var id=nid(), wrap=h('div',{class:'field'});
  function lab(){var l=h('label',{class:'q',for:id},[f.l||'']);if(f.hint)l.appendChild(h('span',{class:'hint',text:' '+f.hint}));return l;}
  if(f.t==='text'||f.t==='date'){
    wrap.appendChild(lab());
    var inp=h('input',{type:f.t==='date'?'date':'text',id:id,value:e[f.k]||''});
    inp.addEventListener('input',function(){e[f.k]=inp.value;onChange();});
    wrap.appendChild(inp);
  } else if(f.t==='area'||f.t==='words'){
    if(f.l){
      var l=lab();
      if(f.icon){l=h('label',{class:'q iconq',for:id},[h('span',{class:'ico',html:ICONS[f.icon]}),h('span',null,[f.l,f.hint?h('span',{class:'hint',style:'display:block',text:f.hint}):null])]);}
      wrap.appendChild(l);
    }
    var ta=h('textarea',{id:id,rows:f.rows||4,'aria-label':f.l?null:(f.t==='words'?'Summary in 50 words':'Response')});
    ta.value=e[f.k]||'';
    var wc=null;
    if(f.t==='words'){wc=h('div',{class:'wc','aria-live':'polite'});}
    function upd(){if(wc){var n=ta.value.trim()?ta.value.trim().split(/\s+/).length:0;wc.textContent=n+' / '+f.limit+' words';wc.classList.toggle('over',n>f.limit);}}
    ta.addEventListener('input',function(){e[f.k]=ta.value;autoGrow(ta);upd();onChange();});
    wrap.appendChild(ta);if(wc)wrap.appendChild(wc);upd();
    requestAnimationFrame(function(){autoGrow(ta);});
  } else if(f.t==='checks'){
    var fs=h('fieldset',{style:'border:0;padding:0;margin:0'});
    fs.appendChild(h('legend',{class:'q',text:f.l}));
    var box=h('div',{class:'checks'});
    f.opts.forEach(function(o){
      var cb=h('input',{type:'checkbox'});cb.checked=(e[f.k]||[]).indexOf(o)>-1;
      cb.addEventListener('change',function(){
        var a=(e[f.k]||[]).filter(function(v){return v!==o;});if(cb.checked)a.push(o);
        e[f.k]=f.opts.filter(function(v){return a.indexOf(v)>-1;});onChange(true);
      });
      box.appendChild(h('label',{class:'chip'},[cb,o]));
    });
    fs.appendChild(box);wrap.appendChild(fs);
  } else if(f.t==='stars'){
    wrap.appendChild(h('div',{class:'q',id:id,text:f.l}));
    var st=h('div',{class:'stars',role:'radiogroup','aria-labelledby':id});
    function draw(){
      st.innerHTML='';
      for(var i=1;i<=5;i++)(function(i){
        st.appendChild(h('button',{type:'button',class:i<=(e[f.k]||0)?'on':'',role:'radio','aria-checked':String(e[f.k]===i),'aria-label':i+' out of 5',onclick:function(){e[f.k]=i;draw();onChange();},text:'★'}));
      })(i);
      if(e[f.k])st.appendChild(h('button',{type:'button',class:'clear',onclick:function(){e[f.k]=0;draw();onChange();},text:'clear'}));
    }
    draw();wrap.appendChild(st);
  } else if(f.t==='table'){
    var tbl=h('table',{class:'ct'});
    var thead=h('thead',null,[h('tr',null,f.cols.map(function(c){return h('th',{scope:'col',text:c});}).concat([h('th',{html:'<span class="sr">Remove</span>'})]))]);
    var tb=h('tbody');tbl.appendChild(thead);tbl.appendChild(tb);
    function drawRows(){
      tb.innerHTML='';
      e[f.k].forEach(function(row,ri){
        var tr=h('tr');
        row.forEach(function(cell,ci){
          var ta=h('textarea',{'aria-label':f.cols[ci]+' (row '+(ri+1)+')'});ta.value=cell;
          ta.addEventListener('input',function(){row[ci]=ta.value;autoGrow(ta);onChange();});
          tr.appendChild(h('td',null,[ta]));requestAnimationFrame(function(){autoGrow(ta);});
        });
        tr.appendChild(h('td',{class:'x'},[e[f.k].length>1?h('button',{class:'del-row',type:'button','aria-label':'Remove row '+(ri+1),title:'Remove row',text:'×',onclick:function(){
          if(row.some(function(c){return c.trim();})&&!confirm('Remove this row and its text?'))return;
          e[f.k].splice(ri,1);drawRows();onChange(true);}}):null]));
        tb.appendChild(tr);
      });
    }
    drawRows();
    wrap.appendChild(tbl);
    wrap.appendChild(h('button',{class:'small-btn',type:'button',text:'+ Add another concept',onclick:function(){e[f.k].push(f.cols.map(function(){return '';}));drawRows();onChange(true);var t=tb.querySelectorAll('textarea');t[t.length-f.cols.length].focus();}}));
  } else if(f.t==='list'){
    var ol=h('ol',{class:'numlist'});
    for(var i=0;i<f.n;i++)(function(i){
      var ta=h('textarea',{rows:2,'aria-label':'Item '+(i+1)});ta.value=(e[f.k]||[])[i]||'';
      ta.addEventListener('input',function(){e[f.k][i]=ta.value;autoGrow(ta);onChange();});
      ol.appendChild(h('li',null,[ta]));requestAnimationFrame(function(){autoGrow(ta);});
    })(i);
    wrap.appendChild(ol);
  }
  return wrap;
}

function renderEntry(sec,e,idx){
  var art=h('section',{class:'entry'});
  var prog=h('span',{class:'prog'});
  function updProg(){var p=entryProgress(sec,e);prog.textContent=p.done+' of '+p.total+' completed';}
  var titleEl=h('h2');
  function updTitle(){
    var t=sec.multi?(sec.entryName+' '+(idx+1)):sec.entryName;
    var sub=sec.titleKey&&String(e[sec.titleKey]||'').trim();
    if(sub){sub=sub.split('\n')[0];if(sub.length>60)sub=sub.slice(0,57)+'…';t+=' — '+sub;}

function b64ToBytes(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
function saveBlob(blob,name){
  if(window.navigator&&window.navigator.msSaveOrOpenBlob){window.navigator.msSaveOrOpenBlob(blob,name);return;}
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},2000);
}

      <p>This journal is built around three sections: <b>Lecture Notes &amp; Critical Thinking</b>, <b>Professional Activities &amp; Learning Tasks</b>, and <b>Literature Review &amp; Research Journal</b>.</p>

      </div>
    </div>
  </details>
  <details class="guide">
    <summary><span class="ico" data-ico="reflect"></span>The Value of Reflection</summary>
    <div class="prose">
      <p>Reflection is often seen as a critical aspect of professional development and growth. Yet for many beginning the journey of reflective practice, this can feel nebulous and unclear. So let’s keep it simple. Experience alone does not automatically lead to learning. We can for instance repeat the same year of practice over and over again without adapting, changing or growing.</p>
      <p>Therefore, while experience is important, development happens only when we critically think about what we are doing and why. We need opportunities to pause, think about what happened, consider why it happened and decide what we might take forward into future situations.</p>
      <p>Reflective practice encourages you to look beyond “What did I do?” and begin asking deeper critical questions:</p>
      <ul><li>Why did I respond in that way?</li><li>What influenced my thinking or actions?</li><li>What worked well?</li><li>What was challenging?</li><li>What assumptions might I have made?</li><li>What have I learned about myself or others?</li><li>What might I do differently next time?</li></ul>
      <p>Reflection is particularly valuable when developing neuroinclusive practice. It gives us an opportunity to consider an experience from perspectives other than our own and to question whether the environment, expectations or systems surrounding an individual supported their participation most effectively.</p>
      <p>In this reflective journal we encourage you to use a structured approach to your reflective practice. There are many excellent models of reflective practice and you are free to use any of these that best suits your thinking processes. However, Gibbs’ Reflective Cycle has been chosen below due to its widely known status and pragmatic approach.</p>
    </div>
  </details>
  <details class="guide">
    <summary><span class="ico" data-ico="practice"></span>Using Gibbs’ Reflective Cycle</summary>
    <div class="prose">
      <p>Gibbs’ Reflective Cycle, developed by Graham Gibbs in 1988, provides six stages that help us move from describing an experience through to identifying what we have learned and how that learning will influence our future actions.</p>
      <div class="gibbs">
        <div><b>1. Description: What happened?</b><br>Begin by briefly describing the experience or situation. Try to keep this section factual rather than immediately judging what happened.<ul><li>What happened?</li><li>Who was involved?</li><li>What was I doing?</li><li>What was the context?</li><li>What was the outcome?</li></ul><p><i>Tip: you do not need to describe every detail — include enough to reflect meaningfully. Ideally do this soon after the event, as details are lost through time.</i></p></div>
        <div><b>2. Feelings: What were you thinking and feeling?</b><br>Our emotional reactions to events can often yield important findings — do not ignore this inner voice.<ul><li>How did I feel at the time?</li><li>What was I thinking?</li><li>Did I feel confident, uncertain, frustrated, uncomfortable or surprised?</li><li>Did my feelings influence how I responded?</li><li>How might the other person have been feeling?</li></ul><p><i>This is not about judging yourself for having a particular reaction. It is about recognising that our emotions, values and assumptions can influence our practice.</i></p></div>
        <div><b>3. Evaluation: What went well and what did not?</b><br>We often dwell too much on what wasn’t ideal and do not celebrate strengths and wins. Focus on both aspects equally.<ul><li>What worked well?</li><li>What did not work as well?</li><li>What helped the situation?</li><li>What created a barrier?</li><li>What was the impact of my actions?</li><li>Was there anything about the environment or system that influenced what happened?</li></ul></div>
        <div><b>4. Analysis: Why did it happen?</b><br>This is where reflection becomes more critical — not negative, but objective analysis of how to improve. Connect your experience to ideas, research, theories or concepts from your studies.<ul><li>Was sensory overload affecting participation?</li><li>Were expectations clear?</li><li>Was the person being required to sustain attention for an unrealistic period?</li><li>Was there sufficient flexibility?</li><li>Was the individual given agency?</li><li>Was significant cognitive or emotional effort required simply to participate?</li><li>Could the environment have been changed rather than expecting the individual to adapt?</li></ul><p><i>Description tells us what happened. Analysis helps us understand why it happened.</i></p></div>
        <div><b>5. Conclusion: What have you learned?</b><br>Draw together the learning from your reflection.<ul><li>What have I learned from this experience?</li><li>Has anything changed my thinking?</li><li>What have I learned about my own practice?</li><li>What have I learned about the needs or experiences of others?</li><li>What could I have done differently?</li><li>What would I want to remember if I encountered a similar situation?</li></ul><p><i>Your conclusion should identify your learning journey, not merely summarise the event.</i></p></div>
        <div><b>6. Action Plan: What will you do next?</b><br>Translate your learning into action — and include both celebration and striving to improve.<ul><li>What will I do differently next time?</li><li>What will I continue doing because it worked well?</li><li>Is there something I need to learn more about?</li><li>Is there a change I could make to the environment?</li><li>Could I anticipate this need in future rather than respond after a difficulty occurs?</li><li>How might this learning influence my wider professional practice?</li></ul></div>
      </div>
      <p>Try to make your action specific. Rather than <i>“Next time I will be more inclusive,”</i> consider <i>“In future, I will discuss sensory and communication preferences with the individual in advance rather than waiting until difficulties arise.”</i></p>
      <p class="key">Remember: reflection is not about finding fault. Sometimes reflection will confirm that something worked particularly well and help you understand why it worked. At other times, it will help you recognise an assumption, barrier or practice that you would like to change.</p>
    </div>
  </details>
  <details class="guide">
    <summary><span class="ico" data-ico="lit"></span>Principles for Sustainable Neuroinclusive Practice</summary>
    <div class="prose">
<h3>What do we mean by neuroinclusive practice?</h3>
<p>Neuroinclusive practice is about creating environments in which different ways of thinking, processing, communicating, interacting and responding are recognised as a natural part of human diversity.</p>
<p>However, Neuro-illuminate® invites us to go further than simply asking whether a neurodivergent person can participate.</p>
<p>A person may be able to attend a full day of training, work in a busy office, contribute to meetings, meet deadlines or cope with a noisy classroom. From the outside, this may look like successful inclusion. What is less visible is the effort that participation may require. The person may be managing sensory overload, consciously monitoring their communication, masking aspects of themselves, trying to maintain attention, dealing with competing information or using considerable executive functioning simply to navigate an environment designed around expectations that do not suit them.</p>
<p>This leads us to one of the key ideas underpinning Neuro-illuminate:</p>
<p class="key">Being able to participate does not necessarily mean that participation is sustainable.</p>
<p>Neuroinclusive practice therefore needs to consider not only access and achievement, but also the neurological cost of participation.</p>
<p>The central question of effective neuro-inclusion becomes:</p>
<p class="key">Can this person participate, contribute and succeed without doing so at an unreasonable or unsustainable neurological cost?</p>
<p>The Neuro-illuminate Principles for Sustainable Neuroinclusive Practice provide nine interconnected ways of thinking about that question.</p>
<h3>1. Expect Difference</h3>
<p>Neuroinclusive practice begins before we know who is neurodivergent.</p>
<p>Traditionally, organisations have often responded to difference after a difficulty has emerged, often on a case-by-case basis. An individual encounters a barrier, discloses a diagnosis or asks for an adjustment, and the organisation then decides how it will respond.</p>
<p>Expect Difference asks us to reverse that thinking.</p>
<p>Instead of designing environments for an imagined "typical" person and adapting them when someone does not fit, we begin with the expectation that people will think, communicate, process information, regulate attention and respond to their environment differently.</p>
<p>This does not mean attempting to predict every possible need. It means recognising variability as normal and considering potential barriers before someone has to experience them.</p>
<p class="think">Think about:</p>
<p>What barriers could somebody experience here, and what could we change before they have to ask us?</p>
<p>The Neuro-illuminate Principles have grown from the theoretical foundations of Universal Design for Learning (UDL), particularly its recognition of learner variability and its emphasis on proactively designing environments that reduce barriers to participation.</p>
<p>UDL was developed by Anne Meyer, David H. Rose and colleagues at CAST, with its theoretical foundations subsequently articulated by Meyer, Rose and David Gordon (2014). Neuro-illuminate builds upon this foundation by focusing specifically on neuroinclusive practice and the neurological cost of participation, considering not simply whether an individual can participate, but whether that participation can be achieved sustainably, without unreasonable cognitive, sensory, emotional or regulatory cost.</p>
<h3>2. Conserve Capacity</h3>
<p>Every environment places demands on us. Some are necessary. Others are simply products of how systems have traditionally been designed. Some fit a world we no longer inhabit. For many neurodivergent people, what appear small demands can accumulate to become a much bigger challenge. Noise, interruptions, unclear instructions, switching between tasks, lack of the right kind of stimulus, unnecessary meetings, social expectations, complex processes or having to repeatedly explain a need – often uses cognitive, sensory, social or emotional resources which are not necessary to expend.</p>
<p>Conserve Capacity requires us to distinguish between the effort that is necessary to perform a meaningful task and the effort someone is expending simply to navigate the environment around the task.</p>
<p>This is therefore more than offering flexibility.</p>
<p>It makes us pause and think about our policies, processes and working cultures. It means actively identifying unnecessary neurological demand and reducing it.</p>
<p>Flexibility should also be available without excessive friction. It shouldn’t for instance require a lengthy application process. If someone has to repeatedly disclose, seek permission or defend their use of an inclusive practice, accessing that flexibility itself consumes capacity and becomes a barrier.</p>
<p>The aim is not to remove challenge. People need challenge to learn, develop and achieve. Instead, we remove unnecessary barriers around the challenge so that the goal can be achieved and the person can develop to their full potential.</p>
<p class="key">Flex the route. Remove the friction. Conserve the energy.</p>
<p class="think">Think about:</p>
<p>What is using this person's capacity, and does it genuinely need to?</p>
<p>Often this is something we require the individual to inform us of so consultation and frequent review is a vital component in conserving capacity.</p>
<h3>3. Seek Understanding</h3>
<p>Behaviour rarely tells us the whole story.</p>
<p>A person who does not make eye contact may still be listening carefully. Someone who does not contribute immediately may need additional processing time. A learner who leaves a room may be regulating sensory overload rather than disengaging. An employee who asks many questions may be seeking clarity rather than challenging authority.</p>
<p>Seek Understanding asks us to become curious and build empathy before becoming corrective.</p>
<p>Importantly, this is slightly different from assuming that we can fully understand someone else's experience through empathy alone. We should be cautious about thinking, "I know how that feels."</p>
<p>Instead it is paramount to listen; ask; notice and remain open to the possibility that our original interpretation may be wrong or not the full picture of what the other person is experiencing.</p>
<p>The shift is subtle but important:</p>
<p>We therefore move from "What is wrong with this behaviour?"</p>
<p>to "What might this behaviour be communicating?"</p>
<h3>4. Enable Recovery</h3>
<p>Participation has a cost, and capacity is not limitless for anyone. Everyone has different capacity for different tasks. Take shopping for instance, some people can shop all day, others have a tolerance for an hour.</p>
<p>There may be times when cognitive, sensory, social or emotional demands exceed the resources someone has available in that moment. This is not a fixed quantity and will fluctuate. Neuroinclusive environments recognise that recovery and regulation are legitimate parts of sustainable participation.</p>
<p>Enabling Recovery means creating opportunities for people to pause, regulate, decompress and return.</p>
<p>It also means challenging the assumption that stepping away represents a failure, lack of competency, poor resilience or lack of commitment. It is something simply that we all require from time to time. A break may be what simply enables continued participation.</p>
<p>Recovery should not always begin at crisis point either. A genuinely neuroinclusive environment helps an individual recognise (and mitigate for) their own energy levels and capacity, so they respond before they reach overload.</p>
<p>Importantly, recovery facilitates re-entry. It is important to consider not only whether someone can step away, but whether they can return without embarrassment, penalty or having to explain themselves. In neuroinclusive environments this should be the norm not the exception.</p>
<p class="think">Think about:</p>
<p>When participation becomes costly, have we created safe ways to pause, recover and return?</p>
<h3>5. Illuminate Strengths</h3>
<p>Neurodiversity conversations can easily become dominated by a deficit-based approach, focusing on the challenges an individual faces, not their strengths. Even well-intentioned support can focus almost exclusively on what a person struggles with and what adjustments they require. No one would enjoy such a conversation.</p>
<p>Illuminate Strengths deliberately changes the lens.</p>
<p>A strengths based approach, helps an individual to notice what they contribute, what conditions enable them to perform at their best to flourish. It helps organisations to evaluate what competence, productivity or excellence are measured.</p>
<p>Strengths should not become stereotypes. We should not assume that every autistic person is highly analytical or that every person with ADHD is creative, for example. Instead, we become curious about the individual's capabilities, interests, motivations, perspectives and potential. The aim is not simply to compensate for difficulty. It is to create conditions in which capability can become visible, utilised and championed.</p>
<p class="think">Think about:</p>
<p>What might this person be capable of that the current environment is preventing us from seeing?</p>
<h3>6. Respect Individuality</h3>
<p>Knowing someone's diagnosis does not mean knowing the person (even the term diagnosis is a loaded one). People who share a diagnostic label may experience that neurotype very differently. Their strengths, difficulties, preferences, identities, experiences and environments will also shape what works for them.</p>
<p>Respecting Individuality therefore challenges formulaic and prescriptive approaches to neuroinclusion. A strategy that works brilliantly for one person may actively create difficulty for another. Any interventions, strategies or approaches therefore require a wide range of optionality to ensure everyone can find a working style that meets their needs. This can often be a challenge in diverse settings. For instance when one person requires background music while another requires silence meeting both individuals’ needs requires careful thought and planning. Categories can help us understand patterns and expect potential barriers, but they should never replace conversation with the individual. Individuals then, need to led the flexibility and adaptations of the setting.</p>
<p class="key">Know the person, not just the label.</p>
<p class="think">Think about:</p>
<p>Am I responding to this person's expressed needs, or to my assumptions about people with this neurotype?</p>
<h3>7. Enable Agency</h3>
<p>Neuroinclusive practice should not simply involve organisations making better decisions for neurodivergent people. People need meaningful influence over the conditions in which they participate.</p>
<p>Enabling Agency means providing appropriate control over factors such as communication, environment, ways of working, pacing, breaks and participation wherever this is possible. This shifts the individual from being the recipient of an adjustment to being an active partner in determining what enables them to succeed. This is an aspect of organisational culture that will constantly require monitoring and development, rather than a fixed policy.</p>
<p>Agency also requires psychological safety. Choice is not meaningful if selecting a different option results in judgement. If someone is technically permitted to turn their camera off but is perceived as disengaged when they do so, the individual does not really have an equal choice.</p>
<p class="think">Think about:</p>
<p>How much control does this person genuinely have over the conditions that enable them to succeed?</p>
<h3>8. Cultivate Belonging</h3>
<p>Access is important, but belonging goes further. Someone can be physically present in an organisation and still feel that successful participation depends on suppressing aspects of themselves.</p>
<p>Cultivate Belonging means creating cultures in which neurological difference is expected and respected rather than merely accommodated. This requires attention to informal expectations as well as formal policies.</p>
<p>Who is viewed as professional? What does an "engaged" learner look like? What communication style is rewarded? What behaviours are interpreted as enthusiasm, capability, leadership or commitment?</p>
<p>Neuroinclusive practice asks whether these expectations genuinely matter or simply reflect established social norms.</p>
<p>The goal is not:</p>
<p>"You can participate here despite being different."</p>
<p>It is closer to:</p>
<p class="key">"Difference already belongs here."</p>
<h3>9. Sustain Participation</h3>
<p>The final principle brings the others together. A successful inclusive intervention should not simply enable someone to participate once. It should support participation over time. Sustained Participation evaluates if the way someone is currently learning, working or contributing can continue without progressively depleting their capacity. This matters because visible performance can conceal invisible cost. Someone may consistently meet expectations while masking, working excessive hours to compensate for executive functioning demands, recovering from sensory overload outside work or using significant emotional resources to appear comfortable within an environment. If this cannot continue indefinitely, we should question whether we can genuinely describe the environment as inclusive.</p>
<p>The final question is therefore:</p>
<p>Can this person continue to participate and succeed here without the environment gradually exhausting the resources they need to do so?</p>
<h3>The Neuro-illuminate Loop</h3><p>These principles should not be understood as a checklist that we complete once. They form a continuous cycle:</p><ol class="loop"><li>Expect Difference</li><li>Conserve Capacity</li><li>Seek Understanding</li><li>Enable Recovery</li><li>Illuminate Strengths</li><li>Respect Individuality</li><li>Enable Agency</li><li>Cultivate Belonging</li><li>Sustain Participation</li><li>&hellip; and Expect Difference again</li></ol>
<p>The final principle takes us back to the beginning. By listening to people's experiences and noticing what supports sustainable participation, we learn more about our environments. That learning allows us to expect barriers more effectively the next time we design a course, workplace, service, meeting, assessment or activity.</p>
<p>Neuro-inclusion therefore becomes an ongoing process of noticing, learning and redesigning, rather than something provided only when an individual requests an adjustment.</p>
<h3>A simple way to apply the Neuro-illuminate theory</h3>
<p>When evaluating a practice, environment or activity, consider five questions:</p><ol class="five"><li><strong>Can they access it?</strong> Have we expected different ways of thinking, processing and participating?</li><li><strong>Can they influence it?</strong> Does the person have meaningful agency over how they participate?</li><li><strong>What does it cost them?</strong> Are there unnecessary cognitive, sensory, social or emotional demands consuming their capacity?</li><li><strong>Can they recover from it?</strong> Are regulation, recovery and re-entry recognised as legitimate parts of participation?</li><li><strong>Can they sustain it?</strong> Could this person continue participating in this way over time without unreasonable neurological cost?</li></ol><p>These questions move us from simply thinking about whether someone can participate towards thinking about the conditions under which participation occurs.</p>
<h3>The central Neuro-illuminate idea</h3>
<p>At the heart of Neuro-illuminate is a simple proposition:</p>
<p>Inclusion is not truly inclusive if participation comes at an unsustainable neurological cost. Neuro-inclusive practice should therefore seek not only to provide access, but to expect difference, conserve capacity, enable recovery, promote agency, recognise strengths and create the conditions for sustainable participation and belonging. The goal is not to make neurodivergent people better able to tolerate environments that were not designed with them in mind.</p>
<p class="key">It is to make the environments themselves better.</p>
